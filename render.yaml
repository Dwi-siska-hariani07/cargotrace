services:
  - type: web
    name: cargotrace
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: CargoTrace
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: cargotrace-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: cargotrace-db
          property: connectionString

databases:
  - name: cargotrace-db
    plan: free
    databaseName: cargotrace
